name: 'openfn deploy'
branding:
  icon: 'upload'
  color: 'purple'
description: 'Deploys an OpenFn project workspace to a Lightning instance'
inputs:
  secret_input:
    description: "OpenFN API KEY"
    required: true
  project_id_input:
    description: "OpenFN Project ID to deploy to"
    required: true
  endpoint_input:
    description: "Lightning URL, e.g. https://app.openfn.org"
    required: true
  force_input:
    description: "Deploy even if the project has changed in Lightning since the last sync"
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Checkout Project export
      uses: actions/checkout@v6
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
    - run: |
        npm install -g @openfn/cli@^1.44.0

        args=(--endpoint "$OPENFN_DEPLOY_ENDPOINT" --no-confirm)
        if [ "$OPENFN_FORCE" = "true" ]; then
          args+=(--force)
        fi
        openfn project deploy "$OPENFN_PROJECT_ID" "${args[@]}"
      shell: bash
      env:
        OPENFN_API_KEY: ${{ inputs.secret_input }}
        OPENFN_PROJECT_ID: ${{ inputs.project_id_input }}
        OPENFN_DEPLOY_ENDPOINT: ${{ inputs.endpoint_input }}
        OPENFN_FORCE: ${{ inputs.force_input }}
        # Sync relies on deploy rewriting the checkout files (.openfn/)
        OPENFN_NO_CHECKOUT_AFTER_DEPLOY: 'false'
    - name: Commit updated state file
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: Changes accepted by Lightning; updated current project state
